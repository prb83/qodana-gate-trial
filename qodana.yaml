version: "1.0"
# The paid linter. It needs QODANA_TOKEN and reads the coverage report in .qodana/code-coverage.
linter: jetbrains/qodana-python:2026.3
profile:
  name: qodana.recommended
# The run fails when the tests cover less than 90 % of the lines of the new code.
failureConditions:
  testCoverageThresholds:
    fresh: 90
